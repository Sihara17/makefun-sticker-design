  <text x="599" y="196" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="106" font-weight="900" letter-spacing="-5" fill="#72E6F4">IT</text>
  <path d="M323 231h378" fill="none" stroke="#E975D4" stroke-width="13" stroke-linecap="round"/>

