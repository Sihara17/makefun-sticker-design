<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Ship It — the last-mile launch crew</title>
  <desc>A quick teal courier bird carries a coded parcel into its final delivery, with the checked seal forming a small checkmark.</desc>
  <defs>
    <path id="sticker" d="M512 38c77 0 128 43 191 66 65 24 162 23 197 82 35 60 8 143 20 216 12 72 52 139 34 210-18 73-91 113-144 169-56 59-103 128-204 156-32 9-63 13-94 13s-62-4-94-13c-101-28-148-97-204-156-53-56-126-96-144-169-18-71 22-138 34-210 12-73-15-156 20-216 35-59 132-58 197-82 63-23 114-66 191-66z"/>
  </defs>
  <use href="#sticker" fill="#182431" stroke="#182431" stroke-width="96" stroke-linejoin="round"/>
  <use href="#sticker" fill="#182431" stroke="#FFF5DF" stroke-width="65" stroke-linejoin="round"/>
  <use href="#sticker" fill="#182431"/>

  <g transform="rotate(-4 512 520)">
    <text x="512" y="206" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="110" font-weight="900" letter-spacing="-5" fill="#FFF5DF">SHIP IT</text>
    <path d="M306 244h412" fill="none" stroke="#EF6547" stroke-width="15" stroke-linecap="round"/>

    <!-- Three compact air trails anchor the direction of travel. -->
    <path d="M222 493h151M187 542h151M239 591h110" fill="none" stroke="#FFF5DF" stroke-width="17" stroke-linecap="round" opacity=".9"/>
    <path d="M247 452h83" fill="none" stroke="#F3B84B" stroke-width="12" stroke-linecap="round"/>

    <!-- A fast courier bird: hooked beak, swept wing and a little postie cap. -->
    <path d="M326 474c32-76 101-132 190-144 78-11 137 15 190 72l76 13-61 43c-11 79-62 140-145 164-64 19-137 6-190-39l-83 12 43-62c-27-16-39-34-20-59z" fill="#EF6547" stroke="#182431" stroke-width="30" stroke-linejoin="round"/>
    <path d="M485 337c82-9 146 24 181 82-85-14-145 2-199 43 1-45 6-86 18-125z" fill="#159B91" stroke="#182431" stroke-width="23" stroke-linejoin="round"/>
    <path d="M622 390c-23-51-70-89-131-103l37-50 106 27 55 68z" fill="#F3B84B" stroke="#182431" stroke-width="24" stroke-linejoin="round"/>
    <path d="M691 330l65 14-57 31" fill="#FFF5DF" stroke="#182431" stroke-width="17" stroke-linejoin="round"/>
    <ellipse cx="676" cy="414" rx="46" ry="38" fill="#FFF5DF" stroke="#182431" stroke-width="15"/>
    <circle cx="689" cy="408" r="10" fill="#182431"/>
    <circle cx="692" cy="405" r="3" fill="#FFF5DF"/>
    <path d="M661 432q12 9 24 2" fill="none" stroke="#EF6547" stroke-width="7" stroke-linecap="round"/>
    <path d="M741 402l91-7-66 51" fill="#F3B84B" stroke="#182431" stroke-width="19" stroke-linejoin="round"/>
    <path d="M628 469c-32 41-71 66-121 78" fill="none" stroke="#FFF5DF" stroke-width="13" stroke-linecap="round"/>
    <path d="M500 564q44 20 83 5" fill="none" stroke="#182431" stroke-width="11" stroke-linecap="round"/>
    <path d="M525 583l-21 36m70-42 13 43" fill="none" stroke="#182431" stroke-width="17" stroke-linecap="round"/>

    <!-- The parcel is the second bold shape; its seal doubles as the check. -->
    <path d="M442 603l139-21 88 57-17 142-143 20-84-62z" fill="#159B91" stroke="#182431" stroke-width="28" stroke-linejoin="round"/>
    <path d="M442 603l92 58 118-22m-118 22-25 140" fill="none" stroke="#FFF5DF" stroke-width="14" stroke-linejoin="round"/>
    <path d="M548 628l47-7 31 21-42 8z" fill="#F3B84B"/>
    <path d="M552 649l19 18 34-39" fill="none" stroke="#182431" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="719" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="42" font-weight="700" fill="#FFF5DF">&lt;/&gt;</text>
  </g>

  <text x="512" y="875" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="77" font-weight="800" letter-spacing="-3" fill="#FFF5DF">make.fun</text>
  <circle cx="512" cy="915" r="8" fill="#F3B84B"/>
</svg>
