<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>The Last-Mile Launch Crew — Holographic Cloud Bird</title>
  <desc>A teal courier swift with a pirate tricorn carries a parcel of code through iridescent mist.</desc>
  <defs>
    <path id="badge" d="M512 38c77 0 128 43 191 66 65 24 162 23 197 82 35 60 8 143 20 216 12 72 52 139 34 210-18 73-91 113-144 169-56 59-103 128-204 156-32 9-63 13-94 13s-62-4-94-13c-101-28-148-97-204-156-53-56-126-96-144-169-18-71 22-138 34-210 12-73-15-156 20-216 35-59 132-58 197-82 63-23 114-66 191-66z"/>
    <linearGradient id="bodyPrism" gradientUnits="userSpaceOnUse" x1="285" y1="410" x2="738" y2="557">
      <stop offset="0" stop-color="#65F4FF" stop-opacity=".94"/>
      <stop offset=".28" stop-color="#34DCCD" stop-opacity=".88"/>
      <stop offset=".56" stop-color="#806BFA" stop-opacity=".9"/>
      <stop offset=".78" stop-color="#EA6BD2" stop-opacity=".88"/>
      <stop offset="1" stop-color="#57EBF4" stop-opacity=".95"/>
