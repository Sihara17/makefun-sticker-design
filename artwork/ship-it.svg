  <path d="M369 454c29-31 63-52 103-65" fill="none" stroke="#B6FCFF" stroke-width="8" stroke-linecap="round"/>
  <path d="M389 463c28-27 58-44 91-55" fill="none" stroke="#72E8E8" stroke-width="6" stroke-linecap="round"/>
