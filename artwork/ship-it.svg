  <path d="M585 644l112-58-11 143-101 50z" fill="#53D8D7"/>
  <text x="507" y="713" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="40" font-weight="700" fill="#17263B">&lt;/&gt;</text>
