<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Ship It! — a Make.fun sticker</title>
  <desc>A bright little code spark races through curly braces toward a checkered finish flag, above the make.fun wordmark.</desc>
  <defs>
    <pattern id="checks" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#FAF8FA"/>
      <path d="M0 0h17v17H0zM17 17h17v17H17z" fill="#17151C"/>
    </pattern>
    <path id="badge" d="M512 44c89 0 154 39 225 58 70 19 164 25 192 92 27 66-12 147-8 227 4 81 35 152 15 225-20 74-87 113-140 172-54 60-104 137-284 162-180-25-230-102-284-162-53-59-120-98-140-172-20-73 11-144 15-225 4-80-35-161-8-227 28-67 122-73 192-92 71-19 136-58 225-58z"/>
  </defs>

  <g transform="translate(41 41) scale(.92)">

  <!-- A cream die-cut edge keeps the silhouette crisp on a dark laptop; the dark keyline holds it on a light one. -->
  <use href="#badge" fill="#17151C" stroke="#17151C" stroke-width="96" stroke-linejoin="round"/>
  <use href="#badge" fill="#17151C" stroke="#FAF8FA" stroke-width="66" stroke-linejoin="round"/>
  <use href="#badge" fill="#17151C"/>

  <!-- Hot-pink race orbit and quiet inner rings. -->
  <circle cx="512" cy="492" r="304" fill="#C51B82"/>
  <circle cx="512" cy="492" r="269" fill="none" stroke="#17151C" stroke-width="9" opacity=".26"/>
  <circle cx="512" cy="492" r="236" fill="none" stroke="#FAF8FA" stroke-width="3" opacity=".18"/>

  <!-- Headline: the whole joke reads before the details. -->
  <text x="560" y="190" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-7" fill="#FAF8FA">SHIP</text>
  <text x="578" y="190" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-7" fill="#FFD34E">IT!</text>

  <!-- Code braces form the starting gate. -->
  <path d="M343 307c-50 0-71 21-71 67v35c0 28-12 42-39 49 27 7 39 21 39 49v35c0 46 21 67 71 67" fill="none" stroke="#17151C" stroke-width="51" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M343 307c-50 0-71 21-71 67v35c0 28-12 42-39 49 27 7 39 21 39 49v35c0 46 21 67 71 67" fill="none" stroke="#FAF8FA" stroke-width="33" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M681 307c50 0 71 21 71 67v35c0 28 12 42 39 49-27 7-39 21-39 49v35c0 46-21 67-71 67" fill="none" stroke="#17151C" stroke-width="51" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M681 307c50 0 71 21 71 67v35c0 28 12 42 39 49-27 7-39 21-39 49v35c0 46-21 67-71 67" fill="none" stroke="#FAF8FA" stroke-width="33" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Two bold motion sweeps make the center feel like a race, not a static badge. -->
  <path d="M350 650c77 43 159 52 245 21 62-22 110-62 144-117" fill="none" stroke="#17151C" stroke-width="43" stroke-linecap="round"/>
  <path d="M350 650c77 43 159 52 245 21 62-22 110-62 144-117" fill="none" stroke="#FFD34E" stroke-width="22" stroke-linecap="round"/>
  <path d="M362 700c52 25 100 37 151 39" fill="none" stroke="#FAF8FA" stroke-width="10" stroke-linecap="round" opacity=".92"/>
  <path d="M375 735c38 16 73 23 105 24" fill="none" stroke="#FAF8FA" stroke-width="7" stroke-linecap="round" opacity=".68"/>

  <!-- Original spark-agent mascot: a smiling four-point code spark with no borrowed character shape. -->
  <path d="M514 331c29 105 62 138 177 166-115 27-148 60-177 166-29-106-62-139-177-166 115-28 148-61 177-166z" fill="#17151C" stroke="#17151C" stroke-width="39" stroke-linejoin="round"/>
  <path d="M514 331c29 105 62 138 177 166-115 27-148 60-177 166-29-106-62-139-177-166 115-28 148-61 177-166z" fill="#FFD34E" stroke="#FAF8FA" stroke-width="12" stroke-linejoin="round"/>
  <ellipse cx="488" cy="483" rx="10" ry="15" fill="#17151C"/>
  <ellipse cx="541" cy="483" rx="10" ry="15" fill="#17151C"/>
  <path d="M489 523q25 27 51 0" fill="none" stroke="#17151C" stroke-width="9" stroke-linecap="round"/>
  <path d="M464 461l-17-14m113 14 17-14" fill="none" stroke="#FAF8FA" stroke-width="8" stroke-linecap="round"/>

  <!-- The checkered flag is the finish line; its thick pole survives small print. -->
  <path d="M742 386v-85" fill="none" stroke="#17151C" stroke-width="27" stroke-linecap="round"/>
  <path d="M742 386v-85" fill="none" stroke="#FAF8FA" stroke-width="13" stroke-linecap="round"/>
  <path d="M755 302q49-23 91 0v71q-42-23-91 0z" fill="url(#checks)" stroke="#17151C" stroke-width="14" stroke-linejoin="round"/>
  <path d="M770 317h15v15h-15zm30 30h15v15h-15z" fill="#C51B82"/>

  <!-- Tiny orbiting glints add energy without making the icon fussy. -->
  <path d="M350 398l9 24 24 9-24 9-9 24-9-24-24-9 24-9z" fill="#FAF8FA"/>
  <path d="M643 594l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#FFD34E"/>
  <circle cx="402" cy="560" r="8" fill="#FAF8FA"/>
  <circle cx="646" cy="419" r="7" fill="#FAF8FA"/>

  <!-- Wordmark is the one readable label at sticker size. -->
  <text x="540" y="850" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="99" font-weight="900" letter-spacing="-6" fill="#FAF8FA">make</text>
  <circle cx="555" cy="819" r="9" fill="#FFD34E"/>
  <text x="576" y="850" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="99" font-weight="900" letter-spacing="-6" fill="#FAF8FA">fun</text>
  <path d="M337 894h350" stroke="#C51B82" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>
