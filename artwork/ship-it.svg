      <stop offset=".55" stop-color="#79DDF4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#D977E5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <use href="#badge" fill="#162439" stroke="#101927" stroke-width="96" stroke-linejoin="round"/>
  <use href="#badge" fill="#162439" stroke="#FFF5DF" stroke-width="65" stroke-linejoin="round"/>
  <use href="#badge" fill="#162439"/>

