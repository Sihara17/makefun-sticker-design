      <stop offset="0" stop-color="#44ECED"/>
      <stop offset=".38" stop-color="#8467F7"/>
      <stop offset=".72" stop-color="#F365C9"/>
      <stop offset="1" stop-color="#87F8EE"/>
    </linearGradient>
    <linearGradient id="tailPrism" gradientUnits="userSpaceOnUse" x1="184" y1="455" x2="342" y2="542">
      <stop offset="0" stop-color="#54EDFA" stop-opacity=".4"/>
      <stop offset=".45" stop-color="#9A68FF" stop-opacity=".82"/>
      <stop offset="1" stop-color="#F46BCF" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="hatPrism" gradientUnits="userSpaceOnUse" x1="595" y1="282" x2="782" y2="384">
      <stop offset="0" stop-color="#172842"/>
      <stop offset=".36" stop-color="#564381"/>
      <stop offset=".65" stop-color="#293968"/>
      <stop offset="1" stop-color="#14263C"/>
    </linearGradient>
    <linearGradient id="hatSheen" gradientUnits="userSpaceOnUse" x1="605" y1="300" x2="757" y2="352">
      <stop offset="0" stop-color="#65F4FF" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#C38BFF" stop-opacity=".88"/>
      <stop offset="1" stop-color="#F27CD2" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="mist" gradientUnits="userSpaceOnUse" x1="199" y1="459" x2="433" y2="579">
      <stop offset="0" stop-color="#59EFFF" stop-opacity=".04"/>
      <stop offset=".4" stop-color="#68DFF7" stop-opacity=".36"/>
      <stop offset=".72" stop-color="#B57CFF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#F078D1" stop-opacity=".02"/>
    </linearGradient>
    <radialGradient id="mistGlow" gradientUnits="userSpaceOnUse" cx="310" cy="508" r="138">
      <stop offset="0" stop-color="#64F5FF" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#8D75FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#E96FD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistLower" gradientUnits="userSpaceOnUse" cx="306" cy="588" r="112">
