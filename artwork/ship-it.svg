  <path d="M190 522c-12-24 5-52 32-55-1-29 31-47 56-33 18-28 59-21 67 10 29-1 48 27 35 51 26 15 25 47-2 59-19 20-49 19-64 1-25 20-60 9-65-15-26 10-55 4-59-18z" fill="url(#mist)"/>
